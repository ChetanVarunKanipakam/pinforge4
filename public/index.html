<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PinForge – STM32 Simulator</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;--bg:#0f1419;--pn:#161c24;--pn2:#121920;--tx:#d7dde4;--mu:#8a97a8;--bd:#263040;--bl:#2f6fed;--gr:#1fa85a;--rd:#d64545;--ac:#3ddc97;--gridc:#1b2430}
html,body{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 Inter,system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,select,input{font:inherit;color:inherit}
#top{display:flex;align-items:center;gap:8px;padding:0 12px;height:52px;background:var(--pn);border-bottom:1px solid var(--bd);flex:none}
.logo{font-size:15px;letter-spacing:.3px;margin-right:6px}.logo span{color:var(--ac)}
#top select,.gh{height:32px;background:var(--bg);border:1px solid #2c384a;border-radius:7px;padding:0 10px;cursor:pointer;max-width:220px}
.sp{flex:1}
.btn{display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:0;border-radius:7px;color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.blue{background:var(--bl)}.btn.green{background:var(--gr)}.btn.red{background:var(--rd)}
.chip{padding:3px 10px;border-radius:99px;font-size:12px;white-space:nowrap;background:#1c2a3f;color:#7fb0ff}.chip.run{background:#10332d;color:#7ee2c0}.chip.warn{background:#3a2f12;color:#f0c76a}.chip.ok{background:#14301f;color:#7ee2a8}.chip.err{background:#3a1717;color:#ff9a9a}
#views{display:flex;align-items:center;gap:2px;padding:0 10px;background:var(--pn2);border-bottom:1px solid var(--bd);flex:none;height:38px}
.tb{padding:0 14px;height:38px;background:none;border:0;color:var(--mu);cursor:pointer}.tb.a{color:var(--tx);box-shadow:inset 0 -2px var(--ac)}
#work{flex:1;display:flex;min-height:0}
#codePane,#circPane{display:flex;flex-direction:column;min-width:0;min-height:0}
#codePane{flex:0 0 42%;border-right:1px solid var(--bd)}#circPane{flex:1;position:relative}
#work[data-v=code] #circPane{display:none}#work[data-v=circuit] #codePane{display:none}#work[data-v=code] #codePane{flex:1;border:0}
.ftabs{display:flex;background:var(--pn);color:var(--mu);flex:none}.ftabs span{padding:8px 14px;cursor:pointer}.ftabs span.a{color:var(--tx);box-shadow:inset 0 -2px var(--ac)}
#note{padding:5px 12px;font-size:11px;color:var(--mu);background:var(--pn2);border-bottom:1px solid var(--bd);flex:none}
.ed{flex:1;display:flex;min-height:0;background:var(--bg)}
#gut{margin:0;padding:12px 8px 12px 12px;text-align:right;color:#5b6a7c;font:13px/20px ui-monospace,Menlo,Consolas,monospace;overflow:hidden;user-select:none}
.cw{position:relative;flex:1;min-width:0}
#hl,#code{position:absolute;inset:0;margin:0;padding:12px;font:13px/20px ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:2;border:0;outline:0}
#hl{overflow:hidden;pointer-events:none}#code{background:transparent;color:transparent;caret-color:#fff;resize:none;overflow:auto;z-index:1}#code::selection{background:#264f78}
.c1{color:#6a9955}.c2{color:#ce9178}.c3{color:#569cd6}.c4{color:#dcdcaa}.c5{color:#4ec9b0}.c6{color:#b5cea8}
#cwrap{flex:1;position:relative;min-height:0;overflow:hidden;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:20px 20px;background-color:#0e1319}
#cv{width:100%;height:100%;display:block;touch-action:none}
#lockb{display:none;position:absolute;top:10px;right:10px;align-items:center;gap:8px;padding:7px 12px;border-radius:99px;background:#10332dee;color:#7ee2c0;font-size:12px;pointer-events:none}
#circPane.locked #lockb{display:flex}
#lockb .lk{display:inline}#hint{position:absolute;left:12px;bottom:10px;color:#6b7a8f;font-size:12px;pointer-events:none}#circPane.locked #hint{display:none}
#plus{position:absolute;right:16px;bottom:16px;width:48px;height:48px;border-radius:99px;border:0;background:var(--bl);color:#fff;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 4px 14px #0008}
#plus:disabled{background:#2a3647;color:#6b7a8f;cursor:not-allowed;box-shadow:none}
#pmenu{display:none;position:absolute;right:16px;bottom:72px;width:240px;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px;box-shadow:0 8px 24px #000a;z-index:5}
#pmenu.on{display:block}#q{width:100%;padding:7px 9px;margin-bottom:6px;background:var(--bg);border:1px solid #2c384a;border-radius:7px}
#pl button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:8px 9px;border-radius:6px;cursor:pointer;text-align:left}#pl button:hover{background:var(--bl)}#pl span{color:var(--mu);font-size:11px}
#insp{flex:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 12px;background:var(--pn);border-top:1px solid var(--bd);color:var(--mu);font-size:12px;min-height:42px}
#insp b{color:var(--tx)}#insp select,#insp input[type=number]{background:var(--bg);border:1px solid #2c384a;border-radius:6px;padding:3px 6px}
#insp button{background:#243041;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}#insp button:disabled{opacity:.4;cursor:not-allowed}#insp button.sw{width:20px;height:20px;padding:0;border:2px solid #0006;border-radius:99px}
#dock{flex:none;height:230px;display:flex;flex-direction:column;background:#0a0e13;border-top:1px solid var(--bd)}#dock.min{height:38px}
#dtabs{display:flex;align-items:center;background:var(--pn2);border-bottom:1px solid var(--bd);flex:none;overflow-x:auto}
#dock.min #dp{display:none}#dp{flex:1;min-height:0;position:relative}
.dpane{display:none;position:absolute;inset:0;overflow:auto}.dpane.a{display:flex;flex-direction:column}
#con{flex:1;overflow:auto;padding:8px 12px;font:12px/1.55 ui-monospace,monospace;color:#7ee2a8;white-space:pre-wrap}
#sr{display:flex;border-top:1px solid var(--bd);flex:none}#si{flex:1;background:transparent;border:0;padding:7px 12px;font:12px ui-monospace,monospace;outline:0}#sr button{background:#243041;border:0;padding:0 14px;cursor:pointer}
#regs,#blog{margin:0;padding:10px 14px;font:12px/1.65 ui-monospace,monospace;color:#9fb6d6;white-space:pre}#blog{color:#a9c4a9;white-space:pre-wrap}
#laTools{display:flex;gap:10px;align-items:center;padding:5px 12px;color:var(--mu);font-size:12px;flex:none}#la{flex:1;width:100%;min-height:0;display:block}
#status{display:flex;align-items:center;gap:18px;padding:0 12px;height:26px;background:#1b2330;color:var(--mu);font-size:12px;flex:none;overflow:hidden;white-space:nowrap}
.pin{cursor:crosshair}.pin:hover{stroke:#fff;stroke-width:2}
#circPane.locked .pin{cursor:not-allowed}
@media(max-width:900px){#lockb .lk{display:none}#lockb{top:6px;right:6px;padding:5px 10px}#codePane{flex:1}#top{height:auto;flex-wrap:wrap;padding:6px 8px;row-gap:6px;column-gap:6px}#top .sp{display:none}.logo{order:0;margin-right:auto}#bBuild,#bRun,#bStop{order:1;min-width:46px;height:40px;justify-content:center;padding:0 12px}.btn span.lb{display:none}#ex{order:2;flex:1;min-width:0;max-width:none}#ld{order:2}#chipBuild{order:3}#chipMode{display:none}#dock{height:34vh}#vsplit{display:none}.hideS{display:none}#plus{width:52px;height:52px}#insp{font-size:12px}}
html,body{overflow-x:hidden}
</style></head><body>
<header id="top"><b class="logo">Pin<span>Forge</span></b>
<select id="ex" title="Project / example"></select><button class="gh" id="ld" title="Load a .bin, .elf or .hex">Load…</button><input type="file" id="fl" accept=".bin,.elf,.hex" hidden>
<span class="sp"></span><span class="chip" id="chipMode">Edit mode</span><span class="chip" id="chipBuild">Ready</span>
<button class="btn blue" id="bBuild" title="Compile main.c (Ctrl+B)"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14l6-6M7 3l6 6-2 2-6-6z" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lb">Build</span></button>
<button class="btn green" id="bRun" title="Run the last build (Ctrl+Enter)"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l9 6-9 6z" fill="#fff"/></svg><span class="lb">Run</span></button>
<button class="btn red" id="bStop" disabled title="Stop the simulation"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h10v10H3z" fill="#fff"/></svg><span class="lb">Stop</span></button></header>
<nav id="views"><button class="tb a" data-v="split" id="vsplit">Split</button><button class="tb" data-v="code">Code</button><button class="tb" data-v="circuit">Circuit</button><span class="sp"></span><span id="tm" class="hideS" style="font:12px ui-monospace,monospace;color:var(--mu)">00:00.000</span></nav>
<main id="work" data-v="split">
<section id="codePane"><div class="ftabs"><span class="a" data-f="c">main.c</span><span data-f="json">diagram.json</span></div><div id="note"></div>
<div class="ed"><pre id="gut"></pre><div class="cw"><pre id="hl"></pre><textarea id="code" spellcheck="false" autocapitalize="off" aria-label="Code editor"></textarea></div></div></section>
<section id="circPane"><div id="cwrap"><svg id="cv" viewBox="0 0 560 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Circuit canvas"></svg>
<div id="lockb"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 7h8v7H4zM6 7V5a2 2 0 0 1 4 0v2" stroke="#7ee2c0" stroke-width="1.5" fill="none"/></svg>Circuit locked while running<span class="lk"> · press Stop to edit</span></div>
<div id="hint">Click a pin, then another pin to wire · wires snap to the 20 px grid</div>
<div id="pmenu"><input id="q" placeholder="Search parts…" autocomplete="off" aria-label="Search parts"><div id="pl"></div></div>
<button id="plus" title="Add a part" aria-label="Add a part">+</button></div><div id="insp"></div></section></main>
<section id="dock"><div id="dtabs"><button class="tb a" data-d="serial">Serial Monitor</button><button class="tb" data-d="regs">CPU Registers</button><button class="tb" data-d="logic">Logic Analyzer</button><button class="tb" data-d="build">Build Log</button><span class="sp"></span><button class="tb" id="dmin" title="Collapse / expand">&#9662;</button></div>
<div id="dp"><div class="dpane a" id="p-serial"><div id="con"></div><div id="sr"><input id="si" placeholder="Send to Serial (USART1)…" autocomplete="off"><button id="sb">Send</button></div></div>
<div class="dpane" id="p-regs"><pre id="regs">Not running.</pre></div>
<div class="dpane" id="p-logic"><div id="laTools"><span>Window</span><select id="laWin"><option value="0.5">0.5 s</option><option value="2" selected>2 s</option><option value="10">10 s</option></select><span id="laInfo"></span></div><canvas id="la"></canvas></div>
<div class="dpane" id="p-build"><pre id="blog">No build yet.</pre></div></div></section>
<footer id="status"><span id="stChip">STM32F103C8 · 8 MHz</span><span id="stFlash">Flash –</span><span class="sp"></span><span id="stRun">Stopped</span></footer>
<script>
/* PinForge Cortex-M3 + STM32F103 emulator */
function CM3(host){
 const T=this;T.host=host||{};
 T.r=new Int32Array(16);T.N=T.Z=T.C=T.V=0;T.it=0;T.ipsr=0;T.primask=0;T.cy=0;T.halted=null;
 T.flash=new Uint8Array(65536);T.ram=new Uint8Array(20480);
 T.pend=[];T.nvEn=[0,0,0];T.nvPend=[0,0,0];T.ipr=new Uint8Array(96);T.shp=new Uint8Array(12);T.act=[];
 T.st={ctrl:0,load:0,val:0,flag:0,acc:0};
 T.rcc={cr:0x83,cfgr:0,apb2:0,apb1:0,ahb:0x14};
 T.gp=[0,1,2].map(()=>({crl:0x44444444,crh:0x44444444,odr:0}));
 T.afio={exticr:[0,0,0,0],mapr:0};
 T.exti={imr:0,emr:0,rtsr:0,ftsr:0,pr:0};T.lastIn=new Array(16).fill(-1);
 T.us=[0,1,2].map(()=>({sr:0xC0,dr:0,brr:0,cr1:0,cr2:0,cr3:0,rx:[]}));
 T.adc={sr:0,cr1:0,cr2:0,sqr3:0,dr:0,smpr1:0,smpr2:0,sqr1:0,sqr2:0};
 T.tim=[0,1,2].map(()=>({cr1:0,psr:0,arr:0xFFFF,cnt:0,sr:0,dier:0,acc:0,ccr:[0,0,0,0],ccmr1:0,ccmr2:0,ccer:0}));
 T.gate=[0x4,0x8,0x10];
 T.reset=function(){T.r.fill(0);T.N=T.Z=T.C=T.V=0;T.it=0;T.ipsr=0;T.halted=null;T.cy=0;T.pend=[];T.act=[];T.ipr.fill(0);T.shp.fill(0);
  T.r[13]=T.rd32(0x08000000)|0;T.r[15]=T.rd32(0x08000004)&~1;T.r[14]=-1;
  T.st={ctrl:0,load:0,val:0,flag:0,acc:0};T.rcc={cr:0x83,cfgr:0,apb2:0,apb1:0,ahb:0x14};T.ram.fill(0);
  T.gp.forEach(g=>{g.crl=g.crh=0x44444444;g.odr=0});T.shadow.forEach(x=>x.fill(-1));T.exti={imr:0,emr:0,rtsr:0,ftsr:0,pr:0};T.nvEn=[0,0,0];T.nvPend=[0,0,0];
  T.us.forEach(u=>{u.sr=0xC0;u.cr1=0;u.rx=[]});T.tim.forEach(t=>{t.cr1=0;t.cnt=0;t.sr=0;t.dier=0;t.acc=0;t.ccr=[0,0,0,0];t.ccmr1=t.ccmr2=t.ccer=0;t.arr=0xFFFF;t.psr=0});
  T.adc={sr:0,cr1:0,cr2:0,sqr3:0,dr:0,smpr1:0,smpr2:0,sqr1:0,sqr2:0};T.lastIn.fill(-1);
  for(let p=0;p<3;p++)T.gpioSync(p)};
 T.load=function(bytes,addr){T.flash.fill(0xFF);for(let i=0;i<bytes.length;i++){const a=(addr||0x08000000)+i-0x08000000;if(a>=0&&a<65536)T.flash[a]=bytes[i]}};
 // ---- memory
 T.rd=function(a,n){a>>>=0;
  if(a>=0x20000000&&a<0x20005000){const o=a-0x20000000;return n==4?(T.ram[o]|T.ram[o+1]<<8|T.ram[o+2]<<16|T.ram[o+3]<<24)>>>0:n==2?T.ram[o]|T.ram[o+1]<<8:T.ram[o]}
  if((a>=0x08000000&&a<0x08010000)||a<0x10000){const o=a&0xFFFF;return n==4?(T.flash[o]|T.flash[o+1]<<8|T.flash[o+2]<<16|T.flash[o+3]<<24)>>>0:n==2?T.flash[o]|T.flash[o+1]<<8:T.flash[o]}
  if(a>=0x40000000||a>=0xE0000000)return T.prd(a,n);
  T.fault('Bus fault: read from 0x'+a.toString(16));return 0};
 T.wr=function(a,n,v){a>>>=0;
  if(a>=0x20000000&&a<0x20005000){const o=a-0x20000000;T.ram[o]=v;if(n>1){T.ram[o+1]=v>>8;if(n>2){T.ram[o+2]=v>>16;T.ram[o+3]=v>>24}}return}
  if(a>=0x40000000||a>=0xE0000000){T.pwr(a,n,v>>>0);return}
  if((a>=0x08000000&&a<0x08010000)||a<0x10000)return;
  T.fault('Bus fault: write to 0x'+a.toString(16))};
 T.rd32=a=>T.rd(a,4);T.fault=m=>{if(!T.halted)T.halted=m};
 // ---- pending / NVIC
 T.prio=function(e){if(e==1)return-3;if(e==2)return-2;if(e==3)return-1;return e<16?T.shp[e-4]&0xF0:T.ipr[e-16]&0xF0};
 T.level=function(){const e=T.exti,m=e.pr&e.imr;if(m)for(let l=0;l<16;l++)if((m>>l)&1)T.irq(l<5?6+l:l<10?23:40);
  for(let i=0;i<3;i++){const t=T.tim[i];if(t.sr&t.dier&0x1F)T.irq(28+i);const u=T.us[i];if((u.cr1&0x2000)&&(((u.cr1&0x20)&&u.rx.length)||(u.cr1&0x80)||((u.cr1&0x40)&&(u.sr&0x40))))T.irq(37+i)}
  if((T.adc.sr&2)&&(T.adc.cr1&0x20))T.irq(18)};
 T.raise=function(exc){if(!T.pend.includes(exc))T.pend.push(exc)};
 T.irq=function(n){const w=n>>5,b=1<<(n&31);T.nvPend[w]|=b;};
 T.checkIrq=function(){for(let w=0;w<3;w++){const m=(T.nvPend[w]&T.nvEn[w])>>>0;if(m){const b=31-Math.clz32(m&-m);T.nvPend[w]&=~(1<<b);T.raise(16+w*32+b)}}};
 // ---- GPIO
 T.shadow=[0,1,2].map(()=>new Int32Array(16).fill(-1));
 T.gpioSync=function(p){if(!T.host.gpio)return;const g=T.gp[p],en=(T.rcc.apb2&T.gate[p])!=0,sh=T.shadow[p];
  for(let i=0;i<16;i++){const cfg=(i<8?g.crl>>>(i*4):g.crh>>>((i-8)*4))&15,odr=(g.odr>>i)&1,key=en?(cfg|(odr<<4)|32):0;
   if(sh[i]!==key){sh[i]=key;T.host.gpio(p,i,en?{mode:cfg&3,cnf:cfg>>2,odr}:{mode:0,cnf:1,odr:0})}}};
 T.pinIn=function(p,i){const g=T.gp[p],cfg=(i<8?g.crl>>>(i*4):g.crh>>>((i-8)*4))&15;if(cfg&3)return(g.odr>>i)&1;return T.host.readPin?T.host.readPin(p,i,cfg>>2,(g.odr>>i)&1):0};
 T.prd=function(a,n){
  if(a>=0xE000E010&&a<=0xE000E01C){const s=T.st;if(a==0xE000E010){const v=s.ctrl|(s.flag<<16);s.flag=0;return v}if(a==0xE000E014)return s.load;if(a==0xE000E018)return s.val;return 0}
  if(a>=0xE000E400&&a<0xE000E460){let v=0;for(let i=0;i<n;i++)v|=T.ipr[a-0xE000E400+i]<<(8*i);return v>>>0}
  if(a>=0xE000ED18&&a<0xE000ED24){let v=0;for(let i=0;i<n;i++)v|=T.shp[a-0xE000ED18+i]<<(8*i);return v>>>0}
  if(a>=0xE000E100&&a<0xE000E10C)return T.nvEn[(a-0xE000E100)>>2];
  if(a>=0xE000E200&&a<0xE000E20C)return T.nvPend[(a-0xE000E200)>>2];
  if(a==0xE000ED00)return 0x411FC231;
  if(a>=0x40021000&&a<0x40021400){const o=a-0x40021000;return o==0?T.rcc.cr|((T.rcc.cr&1)<<1)|(((T.rcc.cr>>16)&1)<<17)|(((T.rcc.cr>>24)&1)<<25):o==4?(T.rcc.cfgr&~0xC)|((T.rcc.cfgr&3)<<2):o==0x14?T.rcc.ahb:o==0x18?T.rcc.apb2:o==0x1C?T.rcc.apb1:o==0x24?0x0C000000:0}
  if(a>=0x40010800&&a<0x40011400){const p=(a-0x40010800)>>10,o=(a-0x40010800)&0x3FF,g=T.gp[p];if(!(T.rcc.apb2&T.gate[p]))return 0;
   if(o==0)return g.crl>>>0;if(o==4)return g.crh>>>0;if(o==8){let v=0;for(let i=0;i<16;i++)v|=T.pinIn(p,i)<<i;return v}if(o==12)return g.odr;return 0}
  if(a>=0x40010000&&a<0x40010400){const o=a&0xFF;return o==4?T.afio.mapr:o>=8&&o<=0x14?T.afio.exticr[(o-8)>>2]:0}
  if(a>=0x40010400&&a<0x40010800){const o=a&0xFF,e=T.exti;return o==0?e.imr:o==4?e.emr:o==8?e.rtsr:o==0xC?e.ftsr:o==0x14?e.pr:0}
  const ui=a==0x40013800?0:a==0x40004400?1:a==0x40004800?2:-1,ua=a&~0x3FF;
  if(ui>=0||ua==0x40013800||ua==0x40004400||ua==0x40004800){const k=ua==0x40013800?0:ua==0x40004400?1:2,u=T.us[k],o=a&0x3FF;
   if(o==0)return(u.sr&~0x20)|(u.rx.length?0x20:0);if(o==4){return u.rx.length?u.rx.shift():0}if(o==8)return u.brr;if(o==0xC)return u.cr1;if(o==0x10)return u.cr2;if(o==0x14)return u.cr3;return 0}

// ---------- status / chips
function chips(){const m=$('chipMode'),b=$('chipBuild');m.className='chip'+(run?' run':'');m.textContent=run?'Running · circuit locked':'Edit mode';
 let t='Ready',c='chip';if(building){t='Building…';c='chip warn'}else if(FW&&FW.dirty){t='Source changed — press Build';c='chip warn'}else if(FW&&FW.info){t='Built · '+FW.info.size+' B';c='chip ok'}else if(FW&&FW.src==null){t='Binary loaded';c='chip ok'}
 b.className=c;b.textContent=t;$('circPane').classList.toggle('locked',run);$('plus').disabled=run;$('plus').title=run?'Circuit is locked while running — press Stop to add parts':'Add a part';
 $('bBuild').disabled=building||!CAN||(FW&&FW.src==null);$('bBuild').title=CAN?'Compile main.c (Ctrl+B)':'Needs the hosted compile server';$('bRun').disabled=run||building;$('bStop').disabled=!run;
 $('stRun').textContent=run?'Running':'Stopped';$('stFlash').textContent=FW&&FW.bytes?'Flash '+(FW.info?FW.info.size:FW.used||'–')+' / 65536 B':'Flash –';$('code').readOnly=!codeEditable();$('ex').disabled=run;$('ld').disabled=run;noteUpdate();barKey='';bar()}
// ---------- build log / serial
const log=t=>{const c=$('con');c.textContent+=t+'\n';c.scrollTop=1e9};
const blog=(t,reset)=>{const b=$('blog');b.textContent=(reset?'':b.textContent+'\n')+t};
function sendSerial(){const v=$('si').value;if(!v)return;rx+=v+'\n';$('si').value='';if(M&&run){for(const ch of v+'\n')M.rxByte(0,ch.charCodeAt(0));log('> '+v)}}
$('sb').onclick=sendSerial;$('si').addEventListener('keydown',e=>{if(e.key=='Enter')sendSerial()});
// ---------- firmware loading & build
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const image=()=>new Uint8Array(65536).fill(0xFF);
function parseFw(b){const im=image();const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
 if(b[0]==0x7f&&b[1]==0x45&&b[2]==0x4c&&b[3]==0x46){const ph=dv.getUint32(0x1C,true),es=dv.getUint16(0x2A,true),n=dv.getUint16(0x2C,true);for(let k=0;k<n;k++){const o=ph+k*es;if(dv.getUint32(o,true)!=1)continue;const off=dv.getUint32(o+4,true),pa=dv.getUint32(o+12,true),fs=dv.getUint32(o+16,true);if(pa>=0x08000000&&pa+fs<=0x08010000)im.set(b.subarray(off,off+fs),pa-0x08000000)}}
 else if(b[0]==0x3A){const t=new TextDecoder().decode(b);let bs=0;for(const ln of t.split(/\r?\n/)){if(ln[0]!=':')continue;const len=parseInt(ln.substr(1,2),16),ad=parseInt(ln.substr(3,4),16),ty=parseInt(ln.substr(7,2),16);if(ty==4)bs=parseInt(ln.substr(9,4),16)*65536;else if(ty==0)for(let i=0;i<len;i++){const a=bs+ad+i-0x08000000;if(a>=0&&a<65536)im[a]=parseInt(ln.substr(9+i*2,2),16)}}}
 else im.set(b.subarray(0,65536));
 if(im.every(x=>x==0xFF))throw Error('no data in the Flash range 0x08000000–0x0800FFFF');return im}
const API=(window.PINFORGE_API||'')+'/api';
async function doBuild(){if(!CAN||building||!FW||FW.src==null)return;building=true;chips();setDock('build');blog('Compiling main.c with arm-none-eabi-gcc (-Os)…',true);
 try{const r=await fetch(API+'/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:FW.src,opt:'Os'})}),j=await r.json();
  if(j.log)blog(j.log);
  if(!j.ok){blog('\nBuild failed.');$('chipBuild').className='chip err';$('chipBuild').textContent='Build failed';building=false;chips();$('chipBuild').className='chip err';$('chipBuild').textContent='Build failed';return}
  const im=image();im.set(b64(j.bin));FW.bytes=im;FW.dirty=false;FW.info={size:j.size,text:j.text,data:j.data,bss:j.bss};blog('\nBuild OK: '+j.size+' bytes (text '+j.text+', data '+j.data+', bss '+j.bss+')'+(run?'\nStop and press Run to load the new build.':''))}
 catch(e){blog('Build failed: could not reach the compile server ('+e.message+')')}
 building=false;chips()}
function doRun(){if(run||building||!FW||!FW.bytes)return;if(FW.dirty){blog('Source changed since the last build — press Build first.',false);setDock('build');chips();return}bootFw()}
function initS(){S={};BN.forEach(b=>{if(/^P[A-C]\d+$/.test(b.l))S[b.l]={m:'INPUT',o:0,pw:null}})}
function refreshLV(){const f=netf();for(let p=0;p<3;p++)for(let i=0;i<16;i++){const n=pn(p,i);if(!S[n]){LV[p][i]=0;continue}const o=sense(f,BID+':'+n);LV[p][i]=o.lo?0:o.hi?1:o.an!=null?(o.an>2047?1:0):2}lvv=ver}
const simNow=()=>M?simT+(M.cy-tickC0)/tickClk:simT;
const HOST={
 gpio(p,i,q){const s=S[pn(p,i)];if(!s)return;let m='INPUT',o=q.odr;if(q.mode){if(q.cnf&1){if(q.odr)m='INPUT';else{m='OUTPUT';o=0}}else m='OUTPUT'}else if(q.cnf==2)m=q.odr?'INPUT_PULLUP':'INPUT';
  s.m=m;s.o=o;if(m!='OUTPUT')s.pw=null;ver++;laSample();rdraw()},
 pwm(p,i,d){const s=S[pn(p,i)];if(!s)return;s.pw=d;ver++;rdraw()},
 readPin(p,i,cnf,odr){if(lvv!==ver)refreshLV();const v=LV[p][i];return v==2?(cnf==2?odr:0):v},
 analog(ch){const n=ch<8?'PA'+ch:ch==8?'PB0':ch==9?'PB1':null;return n?aread(n):0},
 serial(k,c){if(c==13)return;sbuf+=String.fromCharCode(c)}};
function fwTick(){if(!M||!run)return;const w0=performance.now(),clk=M.sysclk(),want=clk*0.01;tickC0=M.cy;tickClk=clk;let n=0;M.setPin();
 while(M.cy-tickC0<want&&!M.halted){M.step();if(!(++n&1023)){M.setPin();if(performance.now()-w0>8)break}}
 const dc=M.cy-tickC0;simT+=dc/clk;tickC0=M.cy;spd=spd*.9+0.1*Math.min(1,(dc/clk)/0.01);
 if(sbuf){const c=$('con');c.textContent+=sbuf;sbuf='';c.scrollTop=1e9}
 if(M.halted){log('CPU halted: '+M.halted);stopSim()}}
function bootFw(){initS();$('con').textContent='';rx='';sbuf='';LA={};
 M=new CM3(HOST);M.load(FW.bytes,0x08000000);const sp=M.rd32(0x08000000),rv=M.rd32(0x08000004);
 if(!(sp>=0x20000000&&sp<=0x20005000)||!(rv>=0x08000000&&rv<0x08010000)){log('Invalid firmware: bad vector table (SP=0x'+sp.toString(16)+', reset=0x'+rv.toString(16)+')');M=null;return}
 simT=0;tickC0=0;spd=1;sel=sel&&sel.k=='p'?sel:null;run=true;M.reset();tickC0=M.cy;laSample();fwTimer=setInterval(fwTick,10);log('Running '+FW.name);setDock(dockT=='build'?'serial':dockT);chips();draw()}
function stopSim(){if(!run&&!M)return;clearInterval(fwTimer);run=false;M=null;pend=null;Object.keys(S).forEach(p=>S[p]={m:'INPUT',o:0,pw:null});chips();draw()}
$('bBuild').onclick=doBuild;$('bRun').onclick=doRun;$('bStop').onclick=()=>{if(run){stopSim();log('Simulation stopped.')}};
function setFw(f){if(run)stopSim();FW=f;if(fileTab=='c')showFile('c');chips();$('stFlash').textContent='Flash '+(f.info?f.info.size:f.used||'–')+' / 65536 B'}
EXS.forEach((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=e.title;$('ex').appendChild(o)});
$('ex').onchange=()=>{const e=EXS[+$('ex').value];setFw({name:e.id+'.bin',bytes:b64(e.b64),src:e.src,dirty:false,used:b64(e.b64).length});blog('Prebuilt example — press Run, or edit and Build.',true)};
$('ld').onclick=()=>$('fl').click();
$('fl').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const im=parseFw(new Uint8Array(await f.arrayBuffer()));const o=document.createElement('option');o.textContent='Loaded: '+f.name;$('ex').appendChild(o);$('ex').value=$('ex').options.length-1;setFw({name:f.name,bytes:im,src:null,dirty:false,used:im.lastIndexOf?(()=>{let n=65536;while(n>0&&im[n-1]==0xFF)n--;return n})():0})}catch(e){blog('Could not load '+f.name+': '+e.message,true);setDock('build')}ev.target.value=''};
// ---------- CPU registers tab
const hx=v=>'0x'+(v>>>0).toString(16).padStart(8,'0');
function regsDraw(){if(dockT!='regs')return;const el=$('regs');if(!M){el.textContent=run?'':'Not running. Press Run to see live CPU state.';return}const r=M.r;let t='';
 for(let i=0;i<13;i+=2)t+=('R'+i).padEnd(4)+hx(r[i])+(i<12?'   '+('R'+(i+1)).padEnd(4)+hx(r[i+1]):'')+'\n';
 t+='SP  '+hx(r[13])+'   LR  '+hx(r[14])+'\nPC  '+hx(r[15])+'   xPSR flags  N'+M.N+' Z'+M.Z+' C'+M.C+' V'+M.V+'   IPSR '+M.ipsr+'\n';
 t+='cycles '+M.cy+'   clock '+(M.sysclk()/1e6)+' MHz   SysTick '+(M.st.ctrl&1?'on':'off')+' load '+M.st.load+'\n\n';
 ['A','B','C'].forEach((n,p)=>{const g=M.gp[p];t+='GPIO'+n+'  CRL '+hx(g.crl)+'  CRH '+hx(g.crh)+'  ODR 0x'+g.odr.toString(16).padStart(4,'0')+'  IDR 0x'+(()=>{let v=0;for(let i=0;i<16;i++)v|=M.pinIn(p,i)<<i;return v})().toString(16).padStart(4,'0')+((M.rcc.apb2&M.gate[p])?'':'   (clock off)')+'\n'});
 t+='\nNVIC enabled '+hx(M.nvEn[0])+' '+hx(M.nvEn[1])+'   pending '+hx(M.nvPend[0])+' '+hx(M.nvPend[1])+'   active '+(M.act.length?M.act.join(','):'none');el.textContent=t}
// ---------- logic analyzer
function laLevel(n){const s=S[n];if(!s)return null;if(s.m=='OUTPUT')return s.pw!=null?2:s.o;if(lvv!==ver)refreshLV();const p='ABC'.indexOf(n[1]),i=+n.slice(2),v=LV[p][i];return v==2?(s.m=='INPUT_PULLUP'?1:3):v}
function laSample(){if(!run&&!M)return;const t=simNow();const wired=new Set();wires.forEach(w=>{[w[0],w[1]].forEach(x=>{if(x.startsWith(BID+':'))wired.add(base(x.slice(BID.length+1)))})});
 for(const n in S){const s=S[n];if(!(s.m=='OUTPUT'||s.m=='INPUT_PULLUP'||wired.has(n)||LA[n]))continue;if(!(s.m=='OUTPUT'||s.m=='INPUT_PULLUP'||LA[n]||wired.has(n)))continue;const v=laLevel(n);if(v===null)continue;if(s.m=='INPUT'&&!LA[n]&&!wired.has(n))continue;
  const a=LA[n]||(LA[n]=[]);if(a.length&&a[a.length-1][1]===v)continue;a.push([t,v]);if(a.length>6000)a.splice(0,2000)}}
function laDraw(){if(dockT!='logic'||$('dock').classList.contains('min'))return;const c=$('la'),W=c.clientWidth,H=c.clientHeight;if(!W||!H)return;const dpr=devicePixelRatio||1;if(c.width!=W*dpr||c.height!=H*dpr){c.width=W*dpr;c.height=H*dpr}const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
 const names=Object.keys(LA).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const win=+$('laWin').value,t1=run?simNow():simT,t0=Math.max(0,t1-win),lw=64;
 $('laInfo').textContent=names.length?names.length+' channel'+(names.length>1?'s':'')+' · t = '+t1.toFixed(3)+' s':'No pins active yet — run a program that configures GPIO pins';
 if(!names.length){x.fillStyle='#5b6a7c';x.font='12px system-ui';x.fillText('Waveforms appear here for output pins, pulled-up inputs and wired pins.',lw,24);return}
 const rh=Math.min(34,(H-18)/names.length);x.font='11px ui-monospace,monospace';x.lineWidth=1;
 const step=win<=0.5?0.1:win<=2?0.5:2;x.strokeStyle='#1f2b3b';x.fillStyle='#5b6a7c';for(let g=Math.ceil(t0/step)*step;g<=t1;g+=step){const gx=lw+(g-t0)/win*(W-lw-8);x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H-16);x.stroke();x.fillText(g.toFixed(step<1?1:0)+'s',gx+2,H-4)}
 names.forEach((n,k)=>{const y0=6+k*rh,hi=y0+4,lo=y0+rh-8;x.fillStyle='#9fb6d6';x.fillText(n,6,y0+rh/2+3);const a=LA[n];let lv=null;for(const e of a){if(e[0]<=t0)lv=e[1];else break}
  const px=t=>lw+(t-t0)/win*(W-lw-8),py=v=>v==1?hi:v==0?lo:(hi+lo)/2;x.strokeStyle=S[n]&&S[n].m=='OUTPUT'?'#7dff9a':'#3bf0c0';x.lineWidth=2;x.beginPath();let cx=lw,cv0=lv===null?a.length?a[0][1]:0:lv;x.moveTo(cx,py(cv0));
  for(const e of a){if(e[0]<=t0)continue;if(e[0]>t1)break;const ex=px(e[0]);x.lineTo(ex,py(cv0));x.lineTo(ex,py(e[1]));cv0=e[1]}x.lineTo(W-8,py(cv0));x.stroke()});}
$('laWin').onchange=laDraw;
setInterval(()=>{if(run){const s=simT;$('tm').textContent=String(s/60|0).padStart(2,'0')+':'+(s%60).toFixed(3).padStart(6,'0');$('stRun').textContent='Running · '+Math.round(spd*100)+'% · '+Math.round(M.sysclk()/1e6)+' MHz';regsDraw();laDraw()}else if(M===null){}},120);
// ---------- start-up
const e0=EXS[0];FW={name:e0.id+'.bin',bytes:b64(e0.b64),src:e0.src,dirty:false,used:b64(e0.b64).length};
setCode(FW.src);setView('split');showFile('c');setDock('serial');initS();draw();chips();
fetch(API+'/health').then(r=>r.json()).then(j=>{if(j&&j.ok){CAN=true;chips();noteUpdate()}}).catch(()=>{});
</script></body></html>
